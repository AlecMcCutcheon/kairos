[workspace]
resolver = "2"
members = ["contracts/kairos-time", "delegates/kairos-identity"]

[profile.release]
lto = true
opt-level = "s"
debug = false
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
freenet-stdlib = { version = "=0.6.1", default-features = false, features = ["contract"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
bs58 = "=0.5.1"
hex = "=0.4.3"
ed25519-compact = { version = "=2.1.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["alloc", "zeroize"] }
